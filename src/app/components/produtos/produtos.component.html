 <input class="form-control mb-3" [(ngModel)]="cod" type="text" name="" id="" placeholder="Digite um codigo"/>
    <button class="btn btn-primary" (click)="goToProduct()">Buscar</button>


<div class="d-flex justify-content-around align-items-center">
    <table class="table">
  <thead>
    <tr >
      <th scope="col">Codigo</th>
      <th scope="col">Nome</th>
      <th scope="col">Preço</th>
      <th scope="col">Ação</th>
    </tr>
  </thead>
  <tbody>
    <tr  *ngFor="let prod of produtos">
      <th scope="row">{{prod.cod}}</th>
      <td>{{prod.nome}}</td>
      <td>{{prod.preco}}</td>
      <td>
        <a routerLink="/produtos/{{prod.cod}}" class="btn btn-primary">Ver Produto</a>
      </td>
    </tr>
  </tbody>
</table>
<router-outlet></router-outlet>
</div>
